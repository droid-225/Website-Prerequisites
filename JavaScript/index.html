<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Learning JavaScript</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <form>
            <h1>Temperature Conversion</h1>
            <input type="number" id="textBox" value="0"><br>

            <input type="radio" id="toF" name="unit">
            <label for="toF">Celsius to Fahrenheit</label><br>
            <input type="radio" id="toC" name="unit">
            <label for="toC">Fahrenheit to Celsius</label><br>

            <button type="button" onclick="convert()">submit</button>
            <p id="result">Select a Unit</p>
        </form>

        <!--always keep script element last to avoid JS errors affecting website visuals-->
        <script src="index.js"></script>
    </body>
</html>
