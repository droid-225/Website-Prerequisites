<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Learning JavaScript</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="slider">
            <div class="slides">
                <img class="slide" src="images/agumon.jpg" alt="Agumon">
                <img class="slide" src="images/greymon.jpg" alt="Greymon">
                <img class="slide" src="images/metalgreymon.jpg" alt="Metal Greymon">
            </div>
            <button class="prev" onclick="prevSlide()">&#10094</button> <!-- &# is used to make unicode characters -->
            <button class="next" onclick="nextSlide()">&#10095</button>
        </div>

        <!--always keep script element last to avoid JS errors affecting website visuals-->
        <script src="index.js"></script>
    </body>
</html>
